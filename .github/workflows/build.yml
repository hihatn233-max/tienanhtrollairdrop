name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Dùng macos-latest để tránh hoàn toàn lỗi provisioning arm64 của macos-14
    runs-on: macos-latest 
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build archive
        run: |
          xcodebuild -project Blast.xcodeproj -scheme Blast \
            -configuration Release -sdk iphoneos \
            -archivePath build/Blast.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ENTITLEMENTS=""

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Blast.xcarchive/Products/Applications/Blast.app build/Payload/
          cd build && zip -r Blast.ipa Payload
          ls -lh Blast.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Blast-ipa
          path: build/Blast.ipa
